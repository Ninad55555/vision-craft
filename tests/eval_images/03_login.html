<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sign in - Ledgerly</title><style>

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#0f172a; background:#fff; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 32px; }

  body { display:flex; min-height:100vh; }
  .side { flex:1; background:linear-gradient(135deg,#0ea5e9,#6366f1); color:#fff; padding:64px; display:flex; flex-direction:column; justify-content:space-between; }
  .side .brand { font-size:24px; font-weight:800; }
  .side h2 { font-size:38px; line-height:1.25; max-width:420px; }
  .side p { opacity:.85; font-size:15px; max-width:400px; line-height:1.6; }
  .panel { width:460px; background:#fff; display:flex; align-items:center; justify-content:center; padding:48px; }
  form { width:100%; }
  form h1 { font-size:26px; margin-bottom:6px; }
  form .hint { color:#64748b; font-size:14px; margin-bottom:28px; }
  label { display:block; font-size:13px; font-weight:600; margin:16px 0 6px; color:#334155; }
  input[type=text], input[type=password] { width:100%; border:1px solid #cbd5e1; border-radius:8px; padding:11px 13px; font-size:14px; }
  .row { display:flex; justify-content:space-between; align-items:center; margin:18px 0 24px; font-size:13px; }
  .row a { color:#6366f1; text-decoration:none; }
  .row label { display:flex; gap:7px; align-items:center; margin:0; font-weight:400; color:#64748b; }
  .submit { width:100%; background:#6366f1; color:#fff; border:none; border-radius:8px; padding:12px; font-size:15px; font-weight:600; }
  .divider { text-align:center; color:#94a3b8; font-size:12px; margin:22px 0; }
  .divider::before, .divider::after { content:''; border-top:1px solid #e2e8f0; position:relative; top:-4px; width:38%; display:inline-block; }
  .divider span { margin:0 10px; }
  .alt { text-align:center; font-size:13px; color:#64748b; }
  .alt a { color:#6366f1; text-decoration:none; font-weight:600; }
</style></head><body>
<div class="side"><div class="brand">&#9679; Ledgerly</div><div><h2>Every invoice, reconciled automatically.</h2><p>Join 8,000+ finance teams closing the books 3 days faster with Ledgerly.</p></div><div style="font-size:13px;opacity:.7">&copy; 2025 Ledgerly &middot; Privacy &middot; Terms</div></div>
<div class="panel"><form><h1>Welcome back</h1><div class="hint">Sign in to your account to continue</div>
<label for="email">Email address</label><input id="email" type="text" placeholder="you@company.com">
<label for="pass">Password</label><input id="pass" type="password" placeholder="Enter your password">
<div class="row"><label><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div>
<button class="submit" type="button">Sign in</button>
<div class="divider"><span>or continue with</span></div>
<button class="submit" type="button" style="background:#0f172a">Google</button>
<p class="alt" style="margin-top:20px">New to Ledgerly? <a href="#">Create an account</a></p>
</form></div></body></html>
