<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Pricing - Typewise</title><style>

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 32px; }

  body { color:#0f172a; }
  header { text-align:center; padding:60px 0 10px; }
  h1 { font-size:40px; letter-spacing:-1px; } header p { color:#64748b; margin-top:10px; }
  .plans { display:grid; grid-template-columns:1fr 1fr; gap:24px; max-width:760px; margin:36px auto; padding:0 24px 60px; }
  .plan { border:1px solid #e2e8f0; border-radius:14px; padding:34px 30px; }
  .plan.dark { background:#0f172a; color:#e2e8f0; border-color:#0f172a; }
  .plan h3 { font-size:16px; color:#64748b; text-transform:uppercase; letter-spacing:1px; }
  .plan.dark h3 { color:#94a3b8; }
  .price { font-size:46px; font-weight:800; margin:12px 0; }
  .price small { font-size:15px; font-weight:400; color:#64748b; }
  ul { list-style:none; margin:20px 0 26px; font-size:14px; }
  li { padding:6px 0; } li::before { content:'\2713  '; color:#16a34a; font-weight:700; }
  .plan.dark li::before { color:#4ade80; }
  button { width:100%; padding:12px; border-radius:8px; font-weight:600; border:1px solid #cbd5e1; background:#fff; }
  .plan.dark button { background:#e2e8f0; border:none; }
</style></head><body>
<header><h1>One plan for writers, one for teams</h1><p>No tiers, no feature gates, no surprises.</p></header>
<div class="plans"><div class="plan"><h3>Personal</h3><div class="price">$8<small>/month</small></div><ul><li>Unlimited documents</li><li>Grammar and style checks</li><li>Export to PDF and Word</li></ul><button>Get Personal</button></div>
<div class="plan dark"><h3>Team</h3><div class="price">$15<small>/user/month</small></div><ul><li>Everything in Personal</li><li>Shared style guides</li><li>SSO and admin controls</li><li>Priority support</li></ul><button>Get Team</button></div></div>
</body></html>
