<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stride</title><style>

  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 32px; }

  body { background:#fff; color:#0f172a; max-width:390px; margin:0 auto; }
  header { padding:26px 20px 6px; } header span { font-size:13px; color:#64748b; } header h1 { font-size:26px; margin-top:2px; }
  .ring { width:210px; height:210px; border-radius:50%; margin:22px auto; background:conic-gradient(#16a34a 0 72%, #e2e8f0 72% 100%); display:flex; align-items:center; justify-content:center; }
  .ring .in { width:160px; height:160px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring b { font-size:34px; } .ring span { font-size:12px; color:#64748b; }
  .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:0 20px; }
  .stat { background:#f8fafc; border-radius:12px; padding:12px 6px; text-align:center; }
  .stat b { display:block; font-size:17px; } .stat span { font-size:11px; color:#64748b; }
  h2 { font-size:16px; padding:22px 20px 10px; }
  .work { display:flex; gap:12px; align-items:center; padding:12px 20px; border-top:1px solid #f1f5f9; }
  .work .ico { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .work b { display:block; font-size:14px; } .work span { font-size:12px; color:#64748b; }
  .work .go { margin-left:auto; color:#16a34a; font-weight:700; font-size:13px; }
  nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:390px; max-width:100%; background:#fff; border-top:1px solid #e2e8f0; display:flex; padding:10px 0 18px; }
  nav div { flex:1; text-align:center; font-size:10px; color:#94a3b8; } nav div.on { color:#16a34a; font-weight:700; }
</style></head><body>
<header><span>TUESDAY, OCT 14</span><h1>Good morning, Alex</h1></header>
<div class="ring"><div class="in"><b>7,248</b><span>of 10,000 steps</span></div></div>
<div class="stats"><div class="stat"><b>4.2 km</b><span>distance</span></div><div class="stat"><b>312</b><span>calories</span></div><div class="stat"><b>6h 48m</b><span>sleep</span></div></div>
<h2>Today's workouts</h2>
<div class="work"><div class="ico" style="background:#dcfce7">&#127939;</div><div><b>Morning run</b><span>5.1 km &middot; 28 min &middot; done</span></div><div class="go">Done</div></div>
<div class="work"><div class="ico" style="background:#fef9c3">&#127947;</div><div><b>Upper body</b><span>32 min &middot; 6:30 PM</span></div><div class="go">Start</div></div>
<div class="work"><div class="ico" style="background:#e0e7ff">&#129496;</div><div><b>Evening stretch</b><span>12 min &middot; 9:00 PM</span></div><div class="go">Start</div></div>
<nav><div class="on">Home</div><div>Workouts</div><div>Stats</div><div>Profile</div></nav>
</body></html>
